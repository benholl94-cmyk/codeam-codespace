# beads-health-report.yml — daily Beads (bd) state health check.
#
# Trigger: schedule (06:00 UTC daily) + workflow_dispatch (manual).
# Scope:   READ-ONLY. NEVER runs `bd dolt pull`, NEVER runs `bd dolt push`,
#          NEVER commits, NEVER pushes. Conservative profile respected.
#
# Side effects:
#   - Posts / updates ONE comment on a tracking issue (labeled `beads-tracker`).
#   - If no tracking issue exists, the workflow logs a warning and exits
#     non-zero (does NOT auto-create one — explicit human action required).
#   - Writes a job summary visible in the Actions UI.

name: beads-health-report

on:
  schedule:
    # Daily at 06:00 UTC (off-peak). Off-peak hour chosen to spread load.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ready_threshold_low:
        description: "Lower threshold for healthy ready count"
        required: false
        default: "1"
      ready_threshold_high:
        description: "Upper threshold for healthy ready count (exclusive)"
        required: false
        default: "50"

concurrency:
  group: beads-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Beads health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bd CLI
        uses: ./.github/actions/setup-bd

      - name: Run bd doctor
        id: doctor
        shell: bash
        run: |
          set -uo pipefail
          OUT="$(bd doctor 2>&1)" && RC=$? || RC=$?
          echo "doctor-rc=${RC}" >> "$GITHUB_OUTPUT"
          {
            echo "doctor-output<<EOF"
            echo "${OUT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::group::bd doctor output"
          echo "${OUT}"
          echo "::endgroup::"

      - name: Run bd stats
        id: stats
        shell: bash
        run: |
          set -uo pipefail
          OUT="$(bd stats 2>&1)" && RC=$? || RC=$?
          echo "stats-rc=${RC}" >> "$GITHUB_OUTPUT"
          {
            echo "stats-output<<EOF"
            echo "${OUT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::group::bd stats output"
          echo "${OUT}"
          echo "::endgroup::"

      - name: Run bd ready and classify health
        id: classify
        shell: bash
        run: |
          set -uo pipefail
          READY_OUT="$(bd ready 2>&1)" && RC=$? || RC=$?
          READY_COUNT="$(printf '%s\n' "${READY_OUT}" | grep -cE '^[a-zA-Z0-9_-]+ ' || true)"
          LOW="${{ inputs.ready_threshold_low || '1' }}"
          HIGH="${{ inputs.ready_threshold_high || '50' }}"
          echo "ready-count=${READY_COUNT}" >> "$GITHUB_OUTPUT"
          echo "ready-rc=${RC}" >> "$GITHUB_OUTPUT"
          {
            echo "ready-output<<EOF"
            echo "${READY_OUT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::group::bd ready output (count=${READY_COUNT})"
          echo "${READY_OUT}"
          echo "::endgroup::"
          # Classify: healthy if count is in [LOW, HIGH).
          if [ "${READY_COUNT}" -lt "${LOW}" ] || [ "${READY_COUNT}" -ge "${HIGH}" ]; then
            echo "status=degraded" >> "$GITHUB_OUTPUT"
            echo "::warning::Beads ready count ${READY_COUNT} is outside healthy range [${LOW}, ${HIGH})"
          else
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "OK: ready count ${READY_COUNT} within [${LOW}, ${HIGH})"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Beads health report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Run timestamp | $(date -u +%FT%TZ) |"
            echo "| Trigger | \${{ github.event_name }} |"
            echo "| \`bd doctor\` exit | \${{ steps.doctor.outputs.doctor-rc }} |"
            echo "| \`bd stats\` exit | \${{ steps.stats.outputs.stats-rc }} |"
            echo "| \`bd ready\` count | \${{ steps.classify.outputs.ready-count }} |"
            echo "| Status | \${{ steps.classify.outputs.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find tracking issue (labeled beads-tracker)
        id: find-tracker
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'beads-tracker',
              per_page: 100,
            });
            if (issues.length === 0) {
              core.warning('No tracking issue found with label `beads-tracker`. Skipping comment step.');
              core.setOutput('found', 'false');
              return;
            }
            const tracker = issues[0]; // first match
            core.setOutput('found', 'true');
            core.setOutput('issue-number', String(tracker.number));
            core.info(`Found tracking issue #${tracker.number}`);

      - name: Post / update tracking-issue comment when degraded
        if: steps.classify.outputs.status == 'degraded' && steps.find-tracker.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.find-tracker.outputs.issue-number }}
          edit-mode: replace
          comment-tag: beads-health-degraded
          body: |
            ⚠️ **Beads health degraded** at `${{ github.event_name }}` run.

            | Metric | Value |
            |---|---|
            | Run timestamp | `${{ github.run_id }}` |
            | `bd doctor` exit | `${{ steps.doctor.outputs.doctor-rc }}` |
            | `bd stats` exit | `${{ steps.stats.outputs.stats-rc }}` |
            | `bd ready` count | `${{ steps.classify.outputs.ready-count }}` |
            | Status | degraded |

            See the Actions run for full output. This comment updates in place on re-runs.

      - name: Fail with diagnostic when degraded and no tracker
        if: steps.classify.outputs.status == 'degraded' && steps.find-tracker.outputs.found != 'true'
        shell: bash
        run: |
          echo "::error::Beads health degraded but no tracking issue exists."
          echo "::error::Create an issue labeled \`beads-tracker\` so this workflow can post diagnostics."
          exit 1
