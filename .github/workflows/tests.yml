# tests.yml — runs the full test pyramid (lint + smoke + pytest + self-test).
#
# Trigger: push, PR, workflow_dispatch.
# Path-filter: only the source/test sub-trees — so noise commits (README
#             typos, .gitignore tweaks, .beads/ JSONL exports) don't
#             burn CI minutes.
# Permissions: minimum — `contents: read` is the baseline.
#
# What this workflow does:
#   1. set up Python 3.11
#   2. install the `[dev]` extras (pytest, hypothesis, jsonschema, ruff)
#   3. install the package (editable) so `import rollout_shield` works
#   4. ruff + mypy (non-strict)
#   5. pytest -m "not slow" — the smoke subset
#   6. self-test — end-to-end scratch-state smoke
#   7. upload coverage + self-test artifacts
#
# Side effects: writes a workflow artifact (junit XML + pytest json).
# No git writes, no commit/push, no `bd dolt push`.

name: tests

on:
  push:
    branches: [main]
    paths:
      - "rollout_shield/**"
      - "tests/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
      - ".github/actions/setup-bd/**"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "rollout_shield/**"
      - "tests/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
      - ".github/actions/setup-bd/**"
  workflow_dispatch:

permissions:
  contents: read

# cap concurrent runs to avoid flapping on rapid pushes
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check rollout_shield tests benchmarks

      - name: ruff format (verify)
        run: ruff format --check rollout_shield tests benchmarks

      - name: mypy (non-strict)
        run: |
          python -m mypy rollout_shield \
            --ignore-missing-imports \
            --no-incremental \
            --no-error-summary \
            || true   # informational for now; tighten once signal is good

  smoke:
    name: pytest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest -m "not slow"
        run: |
          python -m pytest \
            -m "not slow" \
            --tb=short \
            --junitxml=pytest-smoke.xml \
            --json-report --json-report-file=pytest-smoke.json \
            -q

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-smoke-${{ github.run_id }}
          path: |
            pytest-smoke.xml
            pytest-smoke.json
          if-no-files-found: ignore

  self-test:
    name: self-test (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Initialize scratch state
        run: |
          export ROLLOUT_SHIELD_STATE="$RUNNER_TEMP/scratch-state"
          mkdir -p "$ROLLOUT_SHIELD_STATE"
          echo "ROLLOUT_SHIELD_STATE=$ROLLOUT_SHIELD_STATE" >> "$GITHUB_ENV"

      - name: Self-test
        run: |
          python -m rollout_shield self-test --json | tee self-test.json

      - name: Self-check
        run: |
          python -m rollout_shield self-check --json | tee self-check.json

      - name: Upload scratch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ github.run_id }}
          path: |
            self-test.json
            self-check.json
          if-no-files-found: ignore
