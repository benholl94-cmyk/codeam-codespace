# docs-integrity.yml — verifies the versioned Beads integration block in CLAUDE.md
# is intact (BEGIN/END markers + expected hash). Read-only; posts no comments.
# Trigger: push to main touching CLAUDE.md or .claude/**; also workflow_dispatch.
# Conflict-free: paths-filtered so it does NOT fire on prebuild-refresh commits,
# which only touch .devcontainer/devcontainer.json.

name: docs-integrity

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-beads-block:
    name: Verify Beads integration block
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify BEGIN / END markers are present
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "BEGIN BEADS INTEGRATION" CLAUDE.md; then
            echo "::error::Missing BEGIN BEADS INTEGRATION marker in CLAUDE.md"
            exit 1
          fi
          if ! grep -q "END BEADS INTEGRATION" CLAUDE.md; then
            echo "::error::Missing END BEADS INTEGRATION marker in CLAUDE.md"
            exit 1
          fi
          echo "OK: BEGIN/END markers present"

      - name: Verify expected version hash
        shell: bash
        run: |
          set -euo pipefail
          # Pinned expected hash from the marker line. If this drifts, the
          # integration block was deliberately upgraded — update this expected
          # value as part of the upgrade PR (do NOT silently bump here).
          EXPECTED_HASH="970c3bf2"
          if ! grep -q "hash:${EXPECTED_HASH}" CLAUDE.md; then
            echo "::error::Expected hash:${EXPECTED_HASH} not found in CLAUDE.md Beads block."
            echo "::error::If the Beads integration was intentionally upgraded, update EXPECTED_HASH in this workflow."
            exit 1
          fi
          echo "OK: hash:${EXPECTED_HASH} present"

      - name: Verify block content is between markers (single block)
        shell: bash
        run: |
          set -euo pipefail
          # Count BEGIN markers; there must be exactly one block.
          BEGIN_COUNT=$(grep -c "BEGIN BEADS INTEGRATION" CLAUDE.md || true)
          END_COUNT=$(grep -c "END BEADS INTEGRATION" CLAUDE.md || true)
          if [ "${BEGIN_COUNT}" -ne 1 ] || [ "${END_COUNT}" -ne 1 ]; then
            echo "::error::Expected exactly 1 BEGIN and 1 END marker; found BEGIN=${BEGIN_COUNT}, END=${END_COUNT}"
            exit 1
          fi
          # BEGIN line must come before END line.
          BEGIN_LINE=$(grep -n "BEGIN BEADS INTEGRATION" CLAUDE.md | head -1 | cut -d: -f1)
          END_LINE=$(grep -n "END BEADS INTEGRATION" CLAUDE.md | head -1 | cut -d: -f1)
          if [ "${BEGIN_LINE}" -ge "${END_LINE}" ]; then
            echo "::error::BEGIN line (${BEGIN_LINE}) is not before END line (${END_LINE})"
            exit 1
          fi
          echo "OK: exactly one block, BEGIN before END (${BEGIN_LINE} < ${END_LINE})"
